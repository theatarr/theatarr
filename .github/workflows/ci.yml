name: ci

# The public checks (docs/dev.md): on every push to main, on pull requests, and by hand from the Actions tab.
# release.yml calls them before it publishes an image.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: test
        run: go test -race -timeout 30m ./...
      - name: build (no cgo)
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/theatarr
      - name: example policy
        run: go run ./cmd/theatarr policy validate examples/policy

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck, lint, unit tests
        run: npm run check
      - name: build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: docker build (not pushed)
        run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t theatarr:ci .
