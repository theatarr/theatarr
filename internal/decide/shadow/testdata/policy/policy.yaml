# Shadow parity policy: each version takes its arr instance's own profile.
profiles:
  zurg:
    from_arr: radarr_4k_debrid/Remux + WEB 2160p
  web:
    from_arr: radarr_4k_web/WEB 2160p
  tv:
    from_arr: sonarr_4k_debrid/4k Preferred
  anime:
    from_arr: sonarr_anime_debrid/Remux-2160p Anime
versions:
  movie-remux:
    kind: movie
    profile: zurg
    library: /media/movies
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  movie-web:
    kind: movie
    profile: web
    library: /media/movies-web
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  tv-2160p:
    kind: series
    profile: tv
    packs: any_upgradable # as an arr on the actuallyevan fork with ACCEPT_RELEASE_ANY_UPGRADABLE
    library: /media/tv
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  anime-tv:
    kind: series
    anime: true
    profile: anime
    packs: any_upgradable
    library: /media/anime
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
indexers:
  public: {kind: torznab, url: http://prowlarr:9696/1/api, privacy: public}
providers:
  rd: {kind: realdebrid, order: 1, url: https://api.real-debrid.com/rest/1.0, api_key_env: THEATARR_RD_KEY}
clients:
  decypharr: {kind: decypharr, url: http://decypharr:8282, callback_view: radarr}
views:
  radarr: {flavour: radarr, path: /radarr, versions: [movie-remux, movie-web], api_key_env: THEATARR_VIEW_RADARR_KEY}
  sonarr: {flavour: sonarr, path: /sonarr, versions: [tv-2160p, anime-tv], api_key_env: THEATARR_VIEW_SONARR_KEY}
egress:
  check_url: https://api.ipify.org
  vpn_ips: [192.0.2.1]
import:
  arr:
    radarr_4k_debrid: {flavour: radarr, url: http://radarr-4k:7878, api_key_env: THEATARR_ARR_RADARR_4K_DEBRID_KEY, version: movie-remux}
    radarr_4k_web:  {flavour: radarr, url: http://radarr-4k-web:7878, api_key_env: THEATARR_ARR_RADARR_4K_WEB_KEY, version: movie-web}
    sonarr_4k_debrid: {flavour: sonarr, url: http://sonarr-4k:8989, api_key_env: THEATARR_ARR_SONARR_4K_DEBRID_KEY, version: tv-2160p}
    sonarr_anime_debrid: {flavour: sonarr, url: http://sonarr-anime:8989, api_key_env: THEATARR_ARR_SONARR_ANIME_DEBRID_KEY, version: anime-tv}
