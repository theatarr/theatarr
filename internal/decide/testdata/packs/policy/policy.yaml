# The season pack rule against the instances' own profiles (from_arr, trimmed to their scored formats): the same
# series versions with the fork's rule (packs: any_upgradable) and with plain Sonarr's (packs: all, the default).
profiles:
  tv:
    from_arr: sonarr_4k_debrid/4k Preferred
  anime:
    from_arr: sonarr_anime_debrid/Remux-2160p Anime
versions:
  tv-2160p:
    kind: series
    profile: tv
    packs: any_upgradable
    library: /media/tv
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  anime-tv:
    kind: series
    anime: true
    profile: anime
    packs: any_upgradable
    library: /media/anime
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  tv-plain:
    kind: series
    profile: tv
    library: /media/tv-plain
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  anime-plain:
    kind: series
    anime: true
    profile: anime
    packs: all
    library: /media/anime-plain
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
indexers:
  public: {kind: torznab, url: http://prowlarr:9696/1/api, privacy: public}
providers:
  rd: {kind: realdebrid, order: 1, url: https://api.real-debrid.com/rest/1.0, api_key_env: THEATARR_RD_KEY}
clients:
  decypharr: {kind: decypharr, url: http://decypharr:8282, callback_view: sonarr}
views:
  sonarr: {flavour: sonarr, path: /sonarr, versions: [tv-2160p, anime-tv], api_key_env: THEATARR_VIEW_SONARR_KEY}
egress:
  check_url: https://api.ipify.org
  vpn_ips: [192.0.2.1]
import:
  arr:
    sonarr_4k_debrid: {flavour: sonarr, url: http://sonarr-4k.test:8989, api_key_env: THEATARR_ARR_SONARR_4K_DEBRID_KEY, version: tv-2160p}
    sonarr_anime_debrid: {flavour: sonarr, url: http://sonarr-anime.test:8989, api_key_env: THEATARR_ARR_SONARR_ANIME_DEBRID_KEY, version: anime-tv}
