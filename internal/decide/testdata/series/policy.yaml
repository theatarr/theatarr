# Series decisions (series_test.go): a standard TV version and an anime version, with policy profiles.
profiles:
  tv:
    qualities:
      - Bluray-2160p Remux
      - Bluray-2160p
      - group: WEB 2160p
        qualities: [WEBDL-2160p, WEBRip-2160p]
    cutoff: Bluray-2160p Remux
    min_score: 0
    cutoff_score: 3000
    formats:
      Season Pack: 10
      HDR: 500
  anime:
    qualities:
      - Bluray-1080p
      - group: WEB 1080p
        qualities: [WEBDL-1080p, WEBRip-1080p, HDTV-1080p]
    cutoff: Bluray-1080p
    min_score: 0
    cutoff_score: 3000
    formats:
      Season Pack: 10
formats:
  Season Pack: {file: formats/season-pack.json, flavour: sonarr}
  HDR:         {file: formats/hdr.json, flavour: sonarr}
versions:
  tv:
    kind: series
    anime: false
    profile: tv
    library: /media/tv
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
  anime-tv:
    kind: series
    anime: true
    profile: anime
    library: /media/anime
    storage: debrid
    indexers: [public]
    providers: [rd]
    client: decypharr
indexers:
  public: {kind: torznab, url: http://prowlarr:9696/1/api, privacy: public}
providers:
  rd: {kind: realdebrid, order: 1, url: https://api.real-debrid.com/rest/1.0, api_key_env: THEATARR_RD_KEY}
clients:
  decypharr: {kind: decypharr, url: http://decypharr:8282, callback_view: sonarr}
views:
  sonarr: {flavour: sonarr, path: /sonarr, versions: [tv, anime-tv], api_key_env: THEATARR_VIEW_SONARR_KEY}
egress:
  check_url: https://api.ipify.org
  vpn_ips: [192.0.2.1]
