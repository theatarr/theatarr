# Outbound webhooks (docs/design/devices.md). Off by default: events are recorded as dropped, nothing is sent.
# Clients install webhooks through a view (Ruddarr: POST notification); they are sent only to allow_hosts. Policy
# targets get arr-shaped payloads for the views they list and, with native, Theatarr's own per-version events. Every
# request goes through the gateway (class webhook); hosts here join its allowlist.
notify:
  enabled: false
  allow_hosts: [notify.ruddarr.com]   # Ruddarr's push relay
  # budget: webhooks
  # retries: 5
  # poll: 15s
