# Example Docker Compose file for Theatarr that uses a published image instead of building one.
#
# Images are published from the first tagged release on (see the repository's Releases page for the versions that
# exist). If the pull fails, no release has been published yet, or the version is wrong: use compose.yaml beside
# this file, which builds the image from source.
#
#   cp examples/compose.image.yaml compose.yaml    # any directory; no checkout of the repository is needed
#   mkdir -p data && sudo chown 65532:65532 data
#   THEATARR_VERSION=1.0.0 docker compose up -d    # a released version, without the leading v; or set it in .env
#   sudo cat data/initial-admin-password           # the first admin password; sign in as admin at http://<host>:7700
#
# Every host path below is a placeholder. docs/quickstart.md explains each one.
services:
  theatarr:
    image: ghcr.io/theatarr/theatarr:${THEATARR_VERSION:?set THEATARR_VERSION to a released version, for example 1.0.0}
    container_name: theatarr           # the name the app's "docker exec theatarr ..." hints use
    restart: unless-stopped            # also needed by the restore from the web UI, which restarts the service
    ports:
      - "7700:7700"
    # The image runs as uid:gid 65532:65532. ./data, the library roots and the trash directory must be writable by
    # it; the debrid mount only needs to be readable.
    volumes:
      - ./data:/data                   # database, backups, logs and the first admin password
      - /mnt/debrid:/mnt/debrid:ro     # the debrid mount (zurg, rclone, ...): Theatarr only reads it
      - /srv/media:/media              # library roots (/media/movies, /media/tv, /media/anime) and the link trash
                                       # (/media/.trash, outside every root); mount them where the media server sees them
      # Optional: a TRaSH-Guides checkout, to follow upstream between releases and for quality sync. The TRaSH
      # quality profiles are built in without it. Clone it first, then uncomment this line and THEATARR_TRASH below:
      #   git clone --depth 1 https://github.com/TRaSH-Guides/Guides.git trash-guides
      # - ./trash-guides:/config/trash:ro
    environment:
      TZ: Etc/UTC                      # the nightly backup runs at 03:00 in this zone
      # THEATARR_TRASH: /config/trash  # the optional TRaSH-Guides checkout above
      # Optional:
      # THEATARR_PUBLIC_URL: http://theatarr.example.com:7700   # Theatarr's address as clients reach it
      # THEATARR_COOKIE_SECURE: always                          # behind an HTTPS reverse proxy
      # THEATARR_FORCE_OFF: router,library,notify               # keep downloads, library writes and notifications off
