# Demo overlay (docs/demo.md "Two copies"): not a policy on its own. Copied into examples/policy beside its files
# (this file added, library.yaml replaced), it gives each arr-fed series version a second Live library of the same
# kind, <key>-theatarr: Theatarr's own copy, with links of its own under /media/library. The demo seed then gives
# every series and anime series a second copy.
versions:
  tv-2160p-theatarr:
    mode: active
    kind: series
    anime: false
    profile: tv-2160p
    packs: any_upgradable
    sonarr: v4plus
    library: /media/library/tv
    storage: debrid
    indexers: [prowlarr-public, dmm, torrentio, zilean]
    providers: [rd, ad, tb]
    client: decypharr

  anime-tv-theatarr:
    mode: active
    kind: series
    anime: true
    profile: anime-tv
    packs: any_upgradable
    sonarr: v4plus
    library: /media/library/anime
    storage: debrid
    indexers: [prowlarr-public, seadex, dmm]
    providers: [rd, ad, tb]
    client: decypharr
